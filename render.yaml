# Render Blueprint for UptimeMonitor
# https://render.com/docs/blueprint-spec
#
# Deploys the server (Docker) and the client (static site built from Vite).
#
# DATABASE: external Supabase Postgres, NOT a Render-managed database.
# Render's free Postgres expires after 30 days and is then deleted, which is what
# took production down. The database now lives in the Supabase project
# "uptime-monitor-prod" (org "uptime-monitor", region us-west-2 / Oregon, same
# region as this server).
#   - Connect through Supabase's transaction pooler (port 6543): Render has no
#     outbound IPv6, and Supabase's direct host is IPv6-only. The session pooler
#     (5432) caps this compute size at 15 connections, below the app's pool of 20.
#   - TLS is required and verified against Supabase's own root CA, which ships in
#     the image at server/src/config/certs/supabase-root-2021.crt.
#   - DB_PASSWORD is a secret: set it in the Render dashboard (sync: false).
#   - The schema is created by the Node server's sequelize.sync() on startup.
#
# After first sync, in the Render dashboard set:
#   uptime-monitor-server  -> CLIENT_URL to the URL Render assigns the
#                             uptime-monitor-client static site; DB_PASSWORD
#   uptime-monitor-client  -> VITE_API_URL and VITE_SOCKET_URL to the
#                             server's URL (build-time)
# then trigger a manual deploy of the client so the vars are baked in.

services:
  - type: web
    name: uptime-monitor-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # MFA_ENCRYPTION_KEY must be exactly 64 hex chars; generateValue produces
      # arbitrary-format strings, so set it manually. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: ALLOW_PRIVATE_URLS
        value: "false"
      - key: DB_HOST
        value: aws-0-us-west-2.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.dtkzrgmqgobhddujrvia
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_FILE
        value: src/config/certs/supabase-root-2021.crt
      - key: CLIENT_URL
        sync: false

  - type: web
    name: uptime-monitor-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
